<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Switch Board</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#101827">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #101827;
            color: #f3f4f6;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #1f2937;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 20px;
            color: #60a5fa;
        }
        .switch-card {
            background: #374151;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .switch-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .switch-title {
            font-size: 18px;
            font-weight: 600;
        }
        /* Toggle Switch Styling */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #4b5563;
            transition: .4s;
            border-radius: 26px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #3b82f6;
        }
        input:checked + .slider:before {
            transform: translateX(24px);
        }
        .timer-section {
            display: flex;
            gap: 8px;
            margin-top: 5px;
        }
        select, button {
            padding: 8px;
            border-radius: 6px;
            border: none;
            outline: none;
            font-size: 14px;
        }
        select {
            flex: 1;
            background: #4b5563;
            color: white;
        }
        button {
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-weight: 600;
        }
        button:active {
            background: #1d4ed8;
        }
        .timer-display {
            font-size: 14px;
            color: #fbbf24;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Smart Switch Board</h1>

        <!-- Switch 1 -->
        <div class="switch-card">
            <div class="switch-header">
                <span class="switch-title">Living Room Light</span>
                <label class="switch">
                    <input type="checkbox" id="switch1" onclick="toggleSwitch(1)">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="timer-section">
                <select id="time1">
                    <option value="1">1 Minute</option>
                    <option value="15">15 Minutes</option>
                    <option value="30">30 Minutes</option>
                    <option value="60">60 Minutes</option>
                </select>
                <button onclick="startTimer(1)">Set Timer</button>
                <button onclick="cancelTimer(1)" style="background: #dc2626;">Cancel</button>
            </div>
            <div class="timer-display" id="display1">Timer: Off</div>
        </div>

        <!-- Switch 2 -->
        <div class="switch-card">
            <div class="switch-header">
                <span class="switch-title">Bedroom Fan</span>
                <label class="switch">
                    <input type="checkbox" id="switch2" onclick="toggleSwitch(2)">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="timer-section">
                <select id="time2">
                    <option value="1">1 Minute</option>
                    <option value="15">15 Minutes</option>
                    <option value="30">30 Minutes</option>
                    <option value="60">60 Minutes</option>
                </select>
                <button onclick="startTimer(2)">Set Timer</button>
                <button onclick="cancelTimer(2)" style="background: #dc2626;">Cancel</button>
            </div>
            <div class="timer-display" id="display2">Timer: Off</div>
        </div>
    </div>

    <script>
        // Page load hone par state aur timers ko restore karne ke liye
        window.onload = function() {
            restoreState(1);
            restoreState(2);
            
            // Har 1 second mein timers ko check karne ke liye taaki background se aane par bhi sahi time dikhe
            setInterval(() => {
                checkTimer(1);
                checkTimer(2);
            }, 1000);
        };

        function toggleSwitch(id) {
            const isChecked = document.getElementById('switch' + id).checked;
            localStorage.setItem('switch_' + id, isChecked);
        }

        function startTimer(id) {
            const minutes = parseInt(document.getElementById('time' + id).value);
            const endTime = Date.now() + (minutes * 60 * 1000); // Future target timestamp calculate hoga
            
            // State localStorage mein save kar do
            localStorage.setItem('endTime_' + id, endTime);
            localStorage.setItem('switch_' + id, 'true');
            document.getElementById('switch' + id).checked = true;
        }

        function cancelTimer(id) {
            localStorage.removeItem('endTime_' + id);
            localStorage.setItem('switch_' + id, 'false');
            document.getElementById('switch' + id).checked = false;
            document.getElementById('display' + id).innerText = "Timer: Off";
        }

        function checkTimer(id) {
            const endTime = localStorage.getItem('endTime_' + id);
            if (!endTime) return;

            const remainingTime = endTime - Date.now();

            if (remainingTime <= 0) {
                // Time khatam hone par switch band kar do
                cancelTimer(id);
            } else {
                // Minutes aur Seconds calculate karna
                const totalSecs = Math.floor(remainingTime / 1000);
                const mins = Math.floor(totalSecs / 60);
                const secs = totalSecs % 60;
                document.getElementById('display' + id).innerText = `Remaining: ${mins}m ${secs}s`;
                
                // Switch on rakho
                document.getElementById('switch' + id).checked = true;
                localStorage.setItem('switch_' + id, 'true');
            }
        }

        function restoreState(id) {
            // Switch ki purani position wapas laana
            const switchState = localStorage.getItem('switch_' + id);
            if (switchState === 'true') {
                document.getElementById('switch' + id).checked = true;
            } else {
                document.getElementById('switch' + id).checked = false;
                document.getElementById('display' + id).innerText = "Timer: Off";
            }

            // Agar pehle se timer chal raha ho toh usko turant check karna
            checkTimer(id);
        }

        // Service worker register karna taaki PWA offline aur properly chale
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('Service Worker Registered Successfully'))
                .catch((err) => console.log('Service Worker Failed', err));
        }
    </script>
</body>
</html>
